name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required repo secrets (Settings → Secrets and variables → Actions):
#   GCP_SA_KEY — Service account JSON key with Artifact Registry Writer + Cloud Run Admin (+ Service Account User).
#   VITE_SUPABASE_URL — e.g. https://xxxx.supabase.co
#   VITE_SUPABASE_PUBLISHABLE_KEY — anon / publishable key (safe to embed in the client bundle).
# Optional:
#   VITE_DEFAULT_APP_EMAIL, VITE_STRIPE_SUBSCRIPTION_CHECKOUT_URL
#   VITE_PUBLIC_SITE_URL (canonical, e.g. https://rishtewalesardarji.in), VITE_ADSENSE_CLIENT (ca-pub-…)
#
# Project/region: jr-consulting-co / us-central1 (edit env block to change).

env:
  PROJECT_ID: jr-consulting-co
  REGION: us-central1
  SERVICE: rishtewalesardarji-app
  AR_REPOSITORY: rishtewalesardarji

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push container image
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_DEFAULT_APP_EMAIL: ${{ secrets.VITE_DEFAULT_APP_EMAIL }}
          VITE_STRIPE_SUBSCRIPTION_CHECKOUT_URL: ${{ secrets.VITE_STRIPE_SUBSCRIPTION_CHECKOUT_URL }}
          VITE_PUBLIC_SITE_URL: ${{ secrets.VITE_PUBLIC_SITE_URL }}
          VITE_ADSENSE_CLIENT: ${{ secrets.VITE_ADSENSE_CLIENT }}
        run: |
          set -euo pipefail
          IMAGE_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${SERVICE}"
          docker build \
            --build-arg "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}" \
            --build-arg "VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}" \
            --build-arg "VITE_DEFAULT_APP_EMAIL=${VITE_DEFAULT_APP_EMAIL:-}" \
            --build-arg "VITE_STRIPE_SUBSCRIPTION_CHECKOUT_URL=${VITE_STRIPE_SUBSCRIPTION_CHECKOUT_URL:-}" \
            --build-arg "VITE_PUBLIC_SITE_URL=${VITE_PUBLIC_SITE_URL:-}" \
            --build-arg "VITE_ADSENSE_CLIENT=${VITE_ADSENSE_CLIENT:-}" \
            -t "${IMAGE_BASE}:${GITHUB_SHA}" \
            -t "${IMAGE_BASE}:latest" \
            .
          docker push "${IMAGE_BASE}:${GITHUB_SHA}"
          docker push "${IMAGE_BASE}:latest"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 80 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --min-instances 0 \
            --max-instances 10 \
            --quiet
